name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: oras-project/setup-oras@v2
        with:
          version: 1.3.3
      - name: Build and run amd64 fixture tests
        run: make test
      - name: Test source artifact publication
        run: make source-integration-test
      - name: Validate amd64 and arm64 builds
        run: docker buildx build --platform linux/amd64,linux/arm64 --provenance=false .
      - name: Save local image for scanning
        run: docker image save --output /tmp/markdown.tar docker.io/hugojosefson/markdown:latest
      - name: Scan local image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          input: /tmp/markdown.tar
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Validate semantic release tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tags must match vX.Y.Z; got %s\n' "${GITHUB_REF_NAME}" >&2
            exit 1
          fi
      - uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/hugojosefson/markdown
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
      - name: Install ORAS
        uses: oras-project/setup-oras@v2
        with:
          version: 1.3.3
      - name: Collect and attach corresponding source
        env:
          IMAGE: docker.io/hugojosefson/markdown
          SUBJECT_DIGEST: ${{ steps.build-push.outputs.digest }}
        run: |
          ./scripts/source-artifact.sh collect "${IMAGE}@${SUBJECT_DIGEST}" "${GITHUB_REF_NAME}" source-artifact
          artifact_digest="$(./scripts/source-artifact.sh publish "${IMAGE}" "${SUBJECT_DIGEST}" "${GITHUB_REF_NAME}" source-artifact)"
          ./scripts/source-artifact.sh verify-published "${IMAGE}" "${SUBJECT_DIGEST}" "${GITHUB_REF_NAME}" "${artifact_digest}"
